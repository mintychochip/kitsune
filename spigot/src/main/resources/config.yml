search:
  radius: 32
  max-radius: 128
  minimum-score: 0.30
  max-results: 32
  max-paths-per-root: 16
  warmup-timeout-seconds: 3
markers:
  duration-seconds: 20
index:
  chunks-per-tick: 2
  roots-per-tick: 8
  reconciliation-period-ticks: 200
  maximum-depth: 4
  maximum-stacks-per-root: 4096
embedding:
  provider: builtin:sparse-v1
